name: Update dns

on:
  schedule:
    - cron: '37 04 */2 * *'  # 每天定时运行
  workflow_dispatch:       # 支持手动触发

jobs:
  update-ip-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write


    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    - name: Update READ
      run: |
          echo "# Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > README.md

    - name: Commit changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
          commit_message: "chore: Auto-update v1v7"
          branch: main  # 替换成你的默认分支名


    - name: 下列表
      run: |
        python ${{ github.workspace }}/xuazai.py
    - name: 清洗 I
      run: |
        
        python ${{ github.workspace }}/clean_ip.py

    - name: Make script executable
      run: chmod +x CloudflareST

    - name: 测速
      env:
        TEST_URL: ${{ secrets.TEST_URL }}
      run: |
        set -e
        ./CloudflareST -f ip.txt -t 8 -sl 1 -n 300 -p 0 -dt 10 -tp 443 -url $TEST_URL -tlr 0

    - name: BestCF
      run: |
        python ${{ github.workspace }}/dd-ns.py
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    

    - name: Clean up Workflow Runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.PAT_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 0

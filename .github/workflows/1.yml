name: Cloudflare IP 自动优选

on:
  workflow_dispatch:

  schedule:
    # 每 6 小时执行一次
    - cron: "0 */6 * * *"

jobs:
  update-dns:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # 2. Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # ======================================================
      # 3. 安装 Python 依赖
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # ======================================================
      # 4. 下载 CloudflareSpeedTest
      # ======================================================

      - name: Download CloudflareST
        run: |
          set -e

          wget -q \
            https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/cfst_linux_amd64.tar.gz \
            -O cfst.tar.gz

          tar -xzf cfst.tar.gz

          # 兼容不同版本文件名
          if [ -f "./cfst" ]; then
            mv ./cfst ./CloudflareST
          elif [ -f "./CloudflareST" ]; then
            true
          else
            echo "找不到 CloudflareST"
            ls -la
            exit 1
          fi

          chmod +x CloudflareST

          ./CloudflareST -v


      # ======================================================
      # 5. 获取 IP + API 初筛
      #
      # 输出：
      # ip.txt
      #
      # 注意：
      # 这里 Python 会检测所有 IP，
      # 不再找到3个就停止。
      # ======================================================

      - name: 获取IP并API检测
        env:
          CHECK_API_URL: ${{ secrets.CHECK_API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -e

          python update_dns.py --prepare-only 2>/dev/null || true


      # ======================================================
      # 6. 上一步 Python 当前版本是“一次性流程”
      #
      # 所以这里实际上重新运行一个专门生成 ip.txt 的脚本
      #
      # 为避免重复 API 检测，下面使用独立 prepare.py
      # ======================================================

      - name: 准备测速IP
        env:
          CHECK_API_URL: ${{ secrets.CHECK_API_URL }}
        run: |
          python prepare_speedtest.py


      # ======================================================
      # 7. CloudflareST 全部测速
      #
      # API 合格的所有 IP
      # ↓
      # CloudflareST
      # ↓
      # result.csv
      # ======================================================

      - name: CloudflareST测速
        env:
          TEST_URL: ${{ secrets.TEST_URL }}
        run: |
          set -e

          if [ ! -s ip.txt ]; then
            echo "ip.txt 不存在或为空"
            exit 1
          fi

          echo "=========================================="
          echo "测速IP数量："
          wc -l ip.txt
          echo "=========================================="

          ./CloudflareST \
            -f ip.txt \
            -t 8 \
            -sl 1 \
            -n 300 \
            -tp 443 \
            -url "$TEST_URL" \
            -tlr 0 \
            -o result.csv \
            -p 0

          echo "=========================================="
          echo "测速结果："
          cat result.csv
          echo "=========================================="


      # ======================================================
      # 8. 选择最快3个 + 更新所有 Cloudflare Zone
      # ======================================================

      - name: 选择最快3个并更新DNS
        env:
          CHECK_API_URL: ${{ secrets.CHECK_API_URL }}
          name: Cloudflare IP 自动优选


name: Send t conhu to Telegram

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Send secret conhu to Telegram
        env:
          TG_BOT: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONHU: ${{ secrets.CF_ZONE_IDKOOD2 }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="conhu secret value: ${CONHU}"
